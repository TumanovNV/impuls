name: Problem report / Сообщить о проблеме
description: Tell us what failed and how to reproduce it / Опишите сбой и способ его повторить
title: "[Problem] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Impuls. GitHub issues are public: remove personal data, clipboard contents, file paths, calendar details, and secrets before submitting.

        Спасибо, что помогаете улучшать Impuls. Issues на GitHub публичны: удалите персональные данные, содержимое буфера, пути к файлам, сведения календаря и секреты.
  - type: textarea
    id: problem
    attributes:
      label: What happened? / Что произошло?
      placeholder: Describe the result you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Как повторить?
      placeholder: |
        1. Open…
        2. Choose…
        3. See…
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency / Частота
      options:
        - Every time / Каждый раз
        - Often / Часто
        - Sometimes / Иногда
        - Once / Один раз
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Impuls version / Версия Impuls
      placeholder: 1.2.4
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS and Mac architecture / macOS и архитектура Mac
      placeholder: macOS 15.6, Apple Silicon
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / Проверка приватности
      options:
        - label: I removed personal, confidential, and security-sensitive data / Я удалил персональные, конфиденциальные и чувствительные данные
          required: true
