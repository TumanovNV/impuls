<!DOCTYPE html>
<html lang="{{HTML_LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-snippet:-1">
  <meta name="author" content="Nikolay Tumanov">
  <meta name="theme-color" media="(prefers-color-scheme:light)" content="#fbfbfd">
  <meta name="theme-color" media="(prefers-color-scheme:dark)" content="#0b0d11">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="{{CANONICAL}}">
{{ALTERNATES}}
  <link rel="icon" href="{{ASSET_PREFIX}}assets/impuls-icon.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="{{ASSET_PREFIX}}assets/impuls-icon.png">
  <style>
    :root{color-scheme:light dark;--bg:#fbfbfd;--surface:#fff;--surface-2:#f4f5f8;--line:rgba(18,20,26,.12);--text:#12141a;--muted:#565c6b;--faint:#6d7280;--accent:#0a5fd6;--max:920px;--radius:14px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    @media(prefers-color-scheme:dark){:root{--bg:#0b0d11;--surface:#14171d;--surface-2:#191d25;--line:rgba(255,255,255,.12);--text:#f0f2f7;--muted:#a0a7b8;--faint:#858b99;--accent:#65a2ff}}
    *{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.68 var(--font);-webkit-font-smoothing:antialiased}a{color:var(--accent);text-underline-offset:3px}.wrap{width:min(var(--max),calc(100% - 40px));margin-inline:auto}
    header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.nav{min-height:60px;display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:9px;color:var(--text);font-weight:650;text-decoration:none;letter-spacing:.02em}.brand img{width:28px;height:28px;border-radius:7px}.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;max-width:48vw;overflow-x:auto;scrollbar-width:none}.lang::-webkit-scrollbar{display:none}.lang a{flex:0 0 auto;color:var(--muted);text-decoration:none;font-size:12px;font-weight:650;padding:6px 8px;border-right:1px solid var(--line)}.lang a:last-child{border-right:0}.lang a[aria-current="page"]{color:var(--text);background:var(--surface-2)}.back{color:var(--muted);text-decoration:none;font-size:14px;white-space:nowrap}.back:hover{color:var(--text)}
    main{padding:64px 0 96px}.eyebrow{margin:0 0 12px;color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}h1,h2,h3{letter-spacing:-.025em;line-height:1.16}h1{font-size:clamp(34px,6vw,58px);margin:0;max-width:18ch}h2{font-size:24px;margin:0 0 14px}h3{font-size:17px;margin:22px 0 8px}.lead{font-size:19px;color:var(--muted);max-width:70ch;margin:22px 0 14px}.meta{color:var(--faint);font-size:14px;margin:0 0 42px}.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:0 0 18px}.toc a{text-decoration:none}.toc a:hover{text-decoration:underline}section{padding:32px 0;border-bottom:1px solid var(--line)}section:last-of-type{border-bottom:0}p{margin:9px 0;color:var(--muted)}ul{margin:10px 0;padding-left:22px;color:var(--muted)}li+li{margin-top:6px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:14px 0}.card p:first-child{margin-top:0}.card p:last-child{margin-bottom:0}.label{display:block;color:var(--faint);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}.table-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:var(--radius)}table{width:100%;border-collapse:collapse;min-width:720px;background:var(--surface)}th,td{text-align:left;vertical-align:top;padding:14px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);background:var(--surface-2)}td{color:var(--muted)}td:first-child{color:var(--text);font-weight:600}.note{border-left:3px solid var(--accent);padding:2px 0 2px 18px;margin:18px 0}.note strong{color:var(--text)}code{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border:1px solid var(--line);padding:2px 5px;border-radius:5px;color:var(--text)}footer{border-top:1px solid var(--line);padding:30px 0 44px;color:var(--faint);font-size:13px}.foot{display:flex;gap:18px;flex-wrap:wrap}.foot a{color:var(--muted)}
    @media(max-width:700px){.brand span{display:none}.nav-right{gap:6px}.lang{max-width:55vw}.lang a{padding-inline:7px}.back span{display:none}.toc{grid-template-columns:1fr}main{padding-top:44px}.wrap{width:min(var(--max),calc(100% - 28px))}}@media(max-width:400px){.brand{display:none}.lang{max-width:64vw}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="../"><img src="{{ASSET_PREFIX}}assets/impuls-icon.png" alt="" width="28" height="28"><span>{{BRAND}}</span></a><div class="nav-right">{{LANGUAGE_SELECTOR}}<a class="back" href="../">← <span>{{BACK}}</span></a></div></div></header>
<main class="wrap">
  <p class="eyebrow">{{EYEBROW}}</p>
  <h1>{{HEADING}}</h1>
  <p class="lead">{{LEAD}}</p>
  <p class="meta">{{REVISION}}</p>
  <nav class="toc" aria-label="{{TOC_ARIA}}">{{TOC}}</nav>
{{SECTIONS}}
</main>
<footer><div class="wrap foot"><span>{{FOOTER_PROJECT}}</span><a href="../">{{FOOTER_SITE}}</a><a href="https://github.com/TumanovNV/impuls">{{FOOTER_SOURCE}}</a></div></footer>
</body>
</html>
