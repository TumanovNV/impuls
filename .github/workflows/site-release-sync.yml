name: site-release-sync

# Keeps release metadata, landing locales, legal locales and sitemap current.
# Generators run only in CI and commit static HTML to the GitHub Pages source.
# This workflow never changes Scripts/version, signs, tags or uploads app assets.

on:
  push:
    branches: [main]
    paths:
      - Scripts/sync-site-product-facts.py
      - Scripts/sync-site-release.py
      - Scripts/sync-site-locales.py
      - Scripts/sync-site-privacy-links.py
      - Scripts/sync-site-privacy-legacy.py
      - Scripts/sync-site-sitemap.py
      - Scripts/build-site-locale.py
      - Scripts/build-site-privacy-locale.py
      - Scripts/site-privacy-template.html
      - Scripts/site-locales/**
      - Scripts/site-privacy-locales/**
      - .github/workflows/site-release-sync.yml
  release:
    types: [published]
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-release-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'TumanovNV/impuls' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main

      - name: Synchronize canonical landing-page facts and routes
        run: |
          set -euo pipefail
          python3 Scripts/sync-site-release.py
          python3 Scripts/sync-site-product-facts.py
          python3 Scripts/sync-site-locales.py
          python3 Scripts/sync-site-privacy-links.py
          python3 Scripts/sync-site-sitemap.py

      - name: Generate all static landing and privacy locales
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r CODE LOCALE_PATH PRIVACY_PATH DEFAULT_CODE; do
            if [[ "$CODE" != "$DEFAULT_CODE" ]]; then
              python3 Scripts/build-site-locale.py --locale "$CODE"
            fi
            python3 Scripts/build-site-privacy-locale.py --locale "$CODE"
          done < <(python3 - <<'PY'
          import json
          data=json.load(open('Scripts/site-locales/registry.json', encoding='utf-8'))
          for item in data['locales']:
              print(f"{item['code']}|{item['path']}|{item['privacy_path']}|{data['default_locale']}")
          PY
          )
          python3 Scripts/sync-site-privacy-legacy.py

      - name: Verify generated website contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const RELEASE_API = 'https://api.github.com/repos/TumanovNV/impuls/releases/latest';" docs/index.html
          grep -F 'function releaseHash(asset,body)' docs/index.html
          grep -F 'data-conversion="feedback"' docs/index.html
          grep -F 'href="privacy/"' docs/index.html

          python3 Scripts/sync-site-release.py --check
          python3 Scripts/sync-site-product-facts.py --check
          python3 Scripts/sync-site-locales.py --check
          python3 Scripts/sync-site-privacy-links.py --check
          python3 Scripts/sync-site-sitemap.py --check
          python3 Scripts/sync-site-privacy-legacy.py --check

          CODES=()
          LANDING_PAGES=(docs/index.html)
          PRIVACY_PAGES=()
          while IFS='|' read -r CODE LOCALE_PATH PRIVACY_PATH DEFAULT_CODE; do
            CODES+=("$CODE")
            if [[ "$CODE" != "$DEFAULT_CODE" ]]; then
              python3 Scripts/build-site-locale.py --locale "$CODE" --check
              LANDING_PAGES+=("docs/${LOCALE_PATH}index.html")
            fi
            python3 Scripts/build-site-privacy-locale.py --locale "$CODE" --check
            PRIVACY_PAGES+=("docs/${PRIVACY_PATH}index.html")
          done < <(python3 - <<'PY'
          import json
          data=json.load(open('Scripts/site-locales/registry.json', encoding='utf-8'))
          for item in data['locales']:
              print(f"{item['code']}|{item['path']}|{item['privacy_path']}|{data['default_locale']}")
          PY
          )

          for PAGE in "${LANDING_PAGES[@]}"; do
            grep -q "releases/download/v.*\.dmg\"" "$PAGE"
            grep -F 'href="privacy/"' "$PAGE"
            for CODE in "${CODES[@]}"; do grep -F "hreflang=\"$CODE\"" "$PAGE"; done
            grep -F 'hreflang="x-default"' "$PAGE"
          done

          for PAGE in "${PRIVACY_PAGES[@]}"; do
            for CODE in "${CODES[@]}"; do grep -F "hreflang=\"$CODE\"" "$PAGE"; done
            grep -F 'hreflang="x-default"' "$PAGE"
            grep -F '2026' "$PAGE"
          done

          grep -F 'Редакция 3.0' docs/privacy/index.html
          grep -F 'Revision 3.0' docs/en/privacy/index.html
          grep -F 'Fassung 3.0' docs/de/privacy/index.html
          grep -F 'Version 3.0' docs/fr/privacy/index.html
          grep -F 'Versión 3.0' docs/es/privacy/index.html
          grep -F '第 3.0 版' docs/ja/privacy/index.html
          grep -F '第 3.0 版' docs/zh-hans/privacy/index.html
          grep -F 'noindex,follow' docs/site-privacy.html

      - name: Commit if anything changed
        shell: bash
        run: |
          set -euo pipefail
          PATHS=(docs/index.html docs/sitemap.xml docs/site-privacy.html)
          while IFS='|' read -r CODE LOCALE_PATH PRIVACY_PATH DEFAULT_CODE; do
            if [[ "$CODE" != "$DEFAULT_CODE" ]]; then PATHS+=("docs/${LOCALE_PATH}index.html"); fi
            PATHS+=("docs/${PRIVACY_PATH}index.html")
          done < <(python3 - <<'PY'
          import json
          data=json.load(open('Scripts/site-locales/registry.json', encoding='utf-8'))
          for item in data['locales']:
              print(f"{item['code']}|{item['path']}|{item['privacy_path']}|{data['default_locale']}")
          PY
          )
          if [[ -z "$(git status --porcelain -- "${PATHS[@]}")" ]]; then
            echo "website markup was already current; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${PATHS[@]}"
          git commit -m "docs: sync localized website and privacy pages"
          git push origin HEAD:main
