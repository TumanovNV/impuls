name: knowledge-base

on:
  pull_request:
    paths:
      - 'knowledge-base/**'
      - 'Scripts/check-knowledge-base.py'
      - 'Scripts/generate-knowledge-map.py'
      - 'Scripts/knowledge-map-manifest.json'
      - '.github/workflows/knowledge-base.yml'
      - 'Scripts/version'
  push:
    branches: [main]
    paths:
      - 'knowledge-base/**'
      - 'Scripts/check-knowledge-base.py'
      - 'Scripts/generate-knowledge-map.py'
      - 'Scripts/knowledge-map-manifest.json'
      - '.github/workflows/knowledge-base.yml'
      - 'Scripts/version'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Validate engineering knowledge base
        run: python3 Scripts/check-knowledge-base.py
      - name: Verify generated source-test-doc map
        run: python3 Scripts/generate-knowledge-map.py --check
