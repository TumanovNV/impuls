name: site-localization

on:
  pull_request:
    branches: [main]
    paths:
      - docs/index.html
      - docs/sitemap.xml
      - Scripts/build-site-locale.py
      - Scripts/site-locales/**
      - Scripts/sync-site-locales.py
      - Scripts/sync-site-sitemap.py
      - Scripts/sync-site-product-facts.py
      - Scripts/sync-site-release.py
      - Tests/PythonTests/**
      - .github/workflows/site-localization.yml
      - .github/workflows/site-release-sync.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run website localization unit tests
        run: python3 -m unittest Tests.PythonTests.test_site_localization -v

      - name: Generate the complete static locale cluster
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/sync-site-product-facts.py
          python3 Scripts/sync-site-locales.py
          python3 Scripts/sync-site-sitemap.py
          for LOCALE in $(python3 - <<'PY'
          import json
          data=json.load(open('Scripts/site-locales/registry.json', encoding='utf-8'))
          print(' '.join(x['code'] for x in data['locales'] if x['code'] != data['default_locale']))
          PY
          ); do
            python3 Scripts/build-site-locale.py --locale "$LOCALE"
          done

      - name: Verify locale generators are idempotent
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/sync-site-product-facts.py --check
          python3 Scripts/sync-site-locales.py --check
          python3 Scripts/sync-site-sitemap.py --check
          for LOCALE in $(python3 - <<'PY'
          import json
          data=json.load(open('Scripts/site-locales/registry.json', encoding='utf-8'))
          print(' '.join(x['code'] for x in data['locales'] if x['code'] != data['default_locale']))
          PY
          ); do
            python3 Scripts/build-site-locale.py --locale "$LOCALE" --check
          done

      - name: Verify static SEO and language routing
        shell: bash
        run: |
          set -euo pipefail
          CODES=()
          PAGES=()
          while IFS='|' read -r CODE PATH; do
            CODES+=("$CODE")
            if [[ -z "$PATH" ]]; then
              PAGES+=("docs/index.html")
            else
              PAGES+=("docs/${PATH}index.html")
            fi
          done < <(python3 - <<'PY'
          import json
          data=json.load(open('Scripts/site-locales/registry.json', encoding='utf-8'))
          for item in data['locales']:
              print(f"{item['code']}|{item['path']}")
          PY
          )

          for PAGE in "${PAGES[@]}"; do
            for CODE in "${CODES[@]}"; do
              grep -F "hreflang=\"$CODE\"" "$PAGE"
            done
            grep -F 'hreflang="x-default"' "$PAGE"
            grep -q 'releases/download/v.*\.dmg"' "$PAGE"
          done

          grep -F '<html lang="fr">' docs/fr/index.html
          grep -F '7 langues' docs/fr/index.html
          grep -F 'Quelles langues Impuls prend-il en charge ?' docs/fr/index.html
          grep -F '<html lang="es">' docs/es/index.html
          grep -F '7 idiomas' docs/es/index.html
          grep -F '¿Qué idiomas admite Impuls?' docs/es/index.html
          grep -F '<html lang="ja">' docs/ja/index.html
          grep -F '7 言語対応' docs/ja/index.html
          grep -F 'Impuls はどの言語に対応していますか？' docs/ja/index.html
          grep -F '<html lang="zh-Hans">' docs/zh-hans/index.html
          grep -F '支持 7 种语言' docs/zh-hans/index.html
          grep -F 'Impuls 支持哪些语言？' docs/zh-hans/index.html
          grep -F 'https://tumanovnv.github.io/impuls/fr/' docs/sitemap.xml
          grep -F 'https://tumanovnv.github.io/impuls/es/' docs/sitemap.xml
          grep -F 'https://tumanovnv.github.io/impuls/ja/' docs/sitemap.xml
          grep -F 'https://tumanovnv.github.io/impuls/zh-hans/' docs/sitemap.xml

      - name: Run repository Python tests separately from Swift
        run: python3 -m unittest discover -s Tests/PythonTests -p 'test_*.py'
