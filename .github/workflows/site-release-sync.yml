name: site-release-sync

# Keeps the website's static release metadata, durable product facts, sitemap and
# locale pages current. The site remains static; generators run only in CI and
# commit the resulting HTML to GitHub Pages.
#
# It cannot loop and it cannot ship anything:
#   * `release.yml` triggers on `push` to `Scripts/version`, which this never touches;
#   * the push trigger below watches only generators/config/workflow, while the bot
#     commit changes only `docs/`;
#   * nothing here signs, tags, builds, or uploads an app asset.

on:
  push:
    branches: [main]
    paths:
      - Scripts/sync-site-product-facts.py
      - Scripts/sync-site-release.py
      - Scripts/sync-site-locales.py
      - Scripts/sync-site-sitemap.py
      - Scripts/build-site-locale.py
      - Scripts/site-locales/**
      - .github/workflows/site-release-sync.yml
  release:
    types: [published]
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-release-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'TumanovNV/impuls' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main

      - name: Write the current release into the canonical Russian page
        run: python3 Scripts/sync-site-release.py

      - name: Keep durable product facts in the canonical Russian page
        run: python3 Scripts/sync-site-product-facts.py

      - name: Keep website locale routing in the canonical Russian page
        run: python3 Scripts/sync-site-locales.py

      - name: Keep the sitemap aligned with the locale registry
        run: python3 Scripts/sync-site-sitemap.py

      - name: Generate static localized pages
        shell: bash
        run: |
          set -euo pipefail
          for LOCALE in $(python3 - <<'PY'
          import json
          data=json.load(open('Scripts/site-locales/registry.json', encoding='utf-8'))
          print(' '.join(x['code'] for x in data['locales'] if x['code'] != data['default_locale']))
          PY
          ); do
            python3 Scripts/build-site-locale.py --locale "$LOCALE"
          done

      - name: Verify the pages still satisfy the site checks
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const RELEASE_API = 'https://api.github.com/repos/TumanovNV/impuls/releases/latest';" docs/index.html
          grep -F 'function releaseHash(asset,body)' docs/index.html
          grep -F 'data-conversion="feedback"' docs/index.html

          python3 Scripts/sync-site-release.py --check
          python3 Scripts/sync-site-product-facts.py --check
          python3 Scripts/sync-site-locales.py --check
          python3 Scripts/sync-site-sitemap.py --check

          CODES=()
          PAGES=()
          while IFS='|' read -r CODE LOCALE_PATH; do
            CODES+=("$CODE")
            if [[ -z "$LOCALE_PATH" ]]; then
              PAGES+=("docs/index.html")
            else
              python3 Scripts/build-site-locale.py --locale "$CODE" --check
              PAGES+=("docs/${LOCALE_PATH}index.html")
            fi
          done < <(python3 - <<'PY'
          import json
          data=json.load(open('Scripts/site-locales/registry.json', encoding='utf-8'))
          for item in data['locales']:
              print(f"{item['code']}|{item['path']}")
          PY
          )

          # Static/no-JS download paths and the complete hreflang cluster are
          # contracts on every published locale.
          for PAGE in "${PAGES[@]}"; do
            grep -q "releases/download/v.*\.dmg\"" "$PAGE"
            for CODE in "${CODES[@]}"; do
              grep -F "hreflang=\"$CODE\"" "$PAGE"
            done
            grep -F 'hreflang="x-default"' "$PAGE"
          done

          # Seven languages is an app capability and stays explicit in every
          # published website locale.
          grep -F '7 языков интерфейса' docs/index.html
          grep -F '7 interface languages' docs/en/index.html
          grep -F '7 Sprachen' docs/de/index.html
          grep -F '7 langues' docs/fr/index.html
          grep -F '7 idiomas' docs/es/index.html
          grep -F '7 言語対応' docs/ja/index.html
          grep -F '支持 7 种语言' docs/zh-hans/index.html
          grep -F 'На каких языках работает Impuls?' docs/index.html
          grep -F 'Which languages does Impuls support?' docs/en/index.html
          grep -F 'Welche Sprachen unterstützt Impuls?' docs/de/index.html
          grep -F 'Quelles langues Impuls prend-il en charge ?' docs/fr/index.html
          grep -F '¿Qué idiomas admite Impuls?' docs/es/index.html
          grep -F 'Impuls はどの言語に対応していますか？' docs/ja/index.html
          grep -F 'Impuls 支持哪些语言？' docs/zh-hans/index.html

      - name: Commit if anything changed
        shell: bash
        run: |
          set -euo pipefail
          PATHS=(docs/index.html docs/sitemap.xml)
          while IFS='|' read -r CODE LOCALE_PATH; do
            if [[ -n "$LOCALE_PATH" ]]; then PATHS+=("docs/${LOCALE_PATH}index.html"); fi
          done < <(python3 - <<'PY'
          import json
          data=json.load(open('Scripts/site-locales/registry.json', encoding='utf-8'))
          for item in data['locales']:
              print(f"{item['code']}|{item['path']}")
          PY
          )
          if [[ -z "$(git status --porcelain -- "${PATHS[@]}")" ]]; then
            echo "website markup was already current; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${PATHS[@]}"
          git commit -m "docs: sync website release metadata and localized pages"
          git push origin HEAD:main
