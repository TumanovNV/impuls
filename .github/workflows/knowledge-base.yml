name: knowledge-base

on:
  pull_request:
    paths:
      - 'knowledge-base/**'
      - 'Sources/**'
      - 'Resources/**'
      - 'Collector/**'
      - 'Scripts/bundle.sh'
      - 'Scripts/version'
      - 'Scripts/check-knowledge-base.py'
      - 'Scripts/generate-knowledge-map.py'
      - 'Scripts/knowledge-map-manifest.json'
      - 'Scripts/check-documentation-guardian.py'
      - 'Scripts/documentation-guardian-rules.json'
      - 'Tests/PythonTests/test_documentation_guardian.py'
      - '.github/workflows/knowledge-base.yml'
  push:
    branches: [main]
    paths:
      - 'knowledge-base/**'
      - 'Sources/**'
      - 'Resources/**'
      - 'Collector/**'
      - 'Scripts/bundle.sh'
      - 'Scripts/version'
      - 'Scripts/check-knowledge-base.py'
      - 'Scripts/generate-knowledge-map.py'
      - 'Scripts/knowledge-map-manifest.json'
      - 'Scripts/check-documentation-guardian.py'
      - 'Scripts/documentation-guardian-rules.json'
      - 'Tests/PythonTests/test_documentation_guardian.py'
      - '.github/workflows/knowledge-base.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate engineering knowledge base
        run: python3 Scripts/check-knowledge-base.py
      - name: Verify generated source-test-doc map
        run: python3 Scripts/generate-knowledge-map.py --check
      - name: Test Documentation Guardian matcher
        run: python3 -m unittest discover -s Tests/PythonTests -p 'test_documentation_guardian.py'
      - name: Verify semantic documentation contracts
        env:
          GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GUARD_BASE:-}" ] && [ "$GUARD_BASE" != "0000000000000000000000000000000000000000" ]; then
            python3 Scripts/check-documentation-guardian.py --base "$GUARD_BASE"
          else
            python3 Scripts/check-documentation-guardian.py
          fi
