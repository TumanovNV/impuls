name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Verify forbidden implementation paths are absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn '/usr/bin/perl|MediaRemote|dl_load_file|DynaLoader' Sources Scripts; then
            echo "Private media integration or process injection detected" >&2
            exit 1
          fi

      - name: Enforce the network boundary
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='URLSession|NSURLSession|URLRequest|NSURLConnection|NWConnection|NWListener|webSocketTask|CFStreamCreatePairWithSocketToHost'
          if find Sources -type f \( -name '*.swift' -o -name '*.m' \) \
              ! -name 'UpdateService.swift' ! -name 'WebMusicPlayer.swift' -print0 \
              | xargs -0 grep -En "$PATTERN"; then
            echo "Network API found outside the update or explicit web-player boundaries" >&2
            exit 1
          fi
          grep -F 'https://github.com/TumanovNV/impuls/releases/latest/download/appcast.xml' Sources/Impuls/Services/UpdateService.swift
          grep -F 'import Sparkle' Sources/Impuls/Services/UpdateService.swift
          grep -F 'import WebKit' Sources/Impuls/Services/WebMusicPlayer.swift
          grep -F 'func show(source: MusicSource)' Sources/Impuls/Services/WebMusicPlayer.swift
          grep -F 'webView.load(URLRequest(url: homeURL))' Sources/Impuls/Services/WebMusicPlayer.swift
          grep -F 'private var webPlayer: WebMusicPlayer?' Sources/Impuls/Services/MediaController.swift
          grep -F 'let player = webPlayer ?? makeWebPlayer()' Sources/Impuls/Services/MediaController.swift
          test "$(grep -RFl 'WebMusicPlayer()' Sources --include='*.swift' | tr '\n' ' ')" = 'Sources/Impuls/Services/MediaController.swift '
          test -s docs/audits/1.3.0-web-music-security.md
          ! grep -RFn 'https://api.github.com/repos/TumanovNV/impuls/releases/latest' Sources

      - name: Verify security and performance budgets
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'exact: "2.9.5"' Package.swift
          grep -F '79bc9e872948e47877e76f194cb0c8e0412b0b90' Package.resolved
          grep -F 'SUVerifyUpdateBeforeExtraction' Scripts/bundle.sh
          grep -F 'SURequireSignedFeed' Scripts/bundle.sh
          grep -F 'SUEnableSystemProfiling' Scripts/bundle.sh
          grep -F 'SUSignedFeedFailureExpirationInterval' Scripts/bundle.sh
          grep -F 'NSAppleEventsUsageDescription' Scripts/bundle.sh
          grep -F 'com.apple.security.automation.apple-events' Resources/Impuls.entitlements
          grep -F 'com.apple.security.automation.apple-events' Resources/Impuls.AdHoc.entitlements
          grep -F 'AEDeterminePermissionToAutomateTarget' Sources/Impuls/Services/PlayerBridge.swift
          ! grep -F 'codesign --force --deep' Scripts/bundle.sh
          grep -F 'BoundedFileReader.read' Sources/Impuls/Services/BackupService.swift
          grep -F 'BoundedFileReader.read' Sources/Impuls/Services/ClipboardHistoryPersistence.swift
          grep -F 'static let maximumSearchCharacters = 16 * 1_024' Sources/Impuls/Services/ImpulsActionsStore.swift
          grep -F 'clipboard-history.writer' Sources/Impuls/Services/ClipboardHistoryPersistence.swift
          grep -F 'isAllowedMeetingURL' Sources/Impuls/Services/CalendarStore.swift
          grep -F 'maximumScannedCharacters = 32 * 1_024' Sources/Impuls/Services/CalendarStore.swift
          grep -F 'io.tumanov.impuls.notes.writer' Sources/Impuls/Services/NoteStore.swift
          grep -F 'io.tumanov.impuls.screenshot-vault' Sources/Impuls/Services/ScreenshotVault.swift
          grep -F 'maximumPendingSaves = 2' Sources/Impuls/Services/ScreenshotVault.swift
          grep -F 'maximumArtworkBytes = 16 * 1_024 * 1_024' Sources/Impuls/Services/PlayerBridge.swift
          grep -F 'let contentDigest: Data' Sources/Impuls/Services/FileToolsService.swift
          grep -F 'hasher.update(data: chunk)' Sources/Impuls/Services/FileToolsService.swift
          grep -F 'BoundedText.firstLine' Sources/Impuls/Services/ImpulsActionsStore.swift

      - name: Verify the feedback privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          FILE=Sources/Impuls/Services/FeedbackService.swift
          grep -F 'https://github.com/TumanovNV/impuls/issues/new' "$FILE"
          grep -F 'No clipboard contents, notes, file names, file paths, calendar data, device identifiers, or logs were added automatically.' "$FILE"
          if grep -En 'URLSession|URLRequest|IOKit|IOPlatformSerialNumber|hostName|machineIdentifier' "$FILE"; then
            echo "Feedback collects or transmits data outside its allow-list" >&2
            exit 1
          fi

      - name: Verify release and feedback metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^VERSION=//p' Scripts/version)"
          test -s "docs/releases/$VERSION.md"
          grep -F "const RELEASE_API = 'https://api.github.com/repos/TumanovNV/impuls/releases/latest';" docs/index.html
          grep -F 'function releaseHash(asset,body)' docs/index.html
          grep -F 'data-conversion="feedback"' docs/index.html
          test -s .github/ISSUE_TEMPLATE/bug_report.yml
          test -s .github/ISSUE_TEMPLATE/feature_request.yml
          test -s .github/ISSUE_TEMPLATE/experience.yml
          grep -F 'blank_issues_enabled: false' .github/ISSUE_TEMPLATE/config.yml
          for FILE in .github/ISSUE_TEMPLATE/bug_report.yml .github/ISSUE_TEMPLATE/feature_request.yml .github/ISSUE_TEMPLATE/experience.yml; do
            grep -F 'id: module' "$FILE"
            grep -F 'id: frequency' "$FILE"
            grep -F 'id: rating' "$FILE"
          done

      - name: Verify adaptive panel appearance
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn 'darkAqua|Color\.white|foregroundStyle\(\.white\)' Sources/Impuls/UI Sources/Impuls/Notch; then
            echo "A hard-coded dark-panel colour bypasses the adaptive theme" >&2
            exit 1
          fi
          grep -F 'Theme.panelBackground' Sources/Impuls/UI/NotchContentView.swift
          grep -F 'Color(nsColor: .labelColor)' Sources/Impuls/UI/Theme.swift

      - name: Verify hover context-menu lifecycle
        shell: bash
        run: |
          set -euo pipefail
          FILE=Sources/Impuls/Notch/NotchController.swift
          grep -F 'NSMenu.didBeginTrackingNotification' "$FILE"
          grep -F 'NSMenu.didEndTrackingNotification' "$FILE"
          grep -F 'menuTrackingState.isHoldingPanelOpen' "$FILE"

      - name: Verify Actions pointer selection lifecycle
        shell: bash
        run: |
          set -euo pipefail
          FILE=Sources/Impuls/UI/ActionsPane.swift
          grep -F '.onHover { hovering = $0 }' "$FILE"
          grep -F '.onTapGesture(perform: select)' "$FILE"
          grep -F 'TapGesture(count: 2)' "$FILE"
          if grep -F 'if $0 { select() }' "$FILE"; then
            echo "Actions selection must not follow pointer hover" >&2
            exit 1
          fi

      - name: Run automated tests
        run: swift test -c release

      - name: Build application
        run: ./Scripts/bundle.sh release

      - name: Verify bundle and identity
        shell: bash
        run: |
          set -euo pipefail
          APP=build/Impuls.app
          VERSION="$(sed -n 's/^VERSION=//p' Scripts/version)"
          test -x "$APP/Contents/MacOS/Impuls"
          test -d "$APP/Contents/Frameworks/Sparkle.framework"
          test ! -e "$APP/Contents/Resources/libcyclopmedia.dylib"
          test -s "$APP/Contents/Resources/AppIcon.icns"
          test -s "$APP/Contents/Resources/ImpulsStatusTemplate.png"
          test -s "$APP/Contents/Resources/ThirdPartyNotices.md"
          test -f "$APP/Contents/Resources/en.lproj/Localizable.strings"
          test -f "$APP/Contents/Resources/ru.lproj/Localizable.strings"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Contents/Info.plist")" = io.tumanov.impuls
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print SUFeedURL' "$APP/Contents/Info.plist")" = 'https://github.com/TumanovNV/impuls/releases/latest/download/appcast.xml'
          test "$(/usr/libexec/PlistBuddy -c 'Print SUPublicEDKey' "$APP/Contents/Info.plist")" = '/fAb0WKLYV8FTT+VkvGKgtIXfsiVG74NlJ+to0BusDg='
          test "$(/usr/libexec/PlistBuddy -c 'Print SUEnableAutomaticChecks' "$APP/Contents/Info.plist")" = false
          test "$(/usr/libexec/PlistBuddy -c 'Print SUAutomaticallyUpdate' "$APP/Contents/Info.plist")" = false
          test "$(/usr/libexec/PlistBuddy -c 'Print SUAllowsAutomaticUpdates' "$APP/Contents/Info.plist")" = false
          test "$(/usr/libexec/PlistBuddy -c 'Print SUEnableSystemProfiling' "$APP/Contents/Info.plist")" = false
          test "$(/usr/libexec/PlistBuddy -c 'Print SUVerifyUpdateBeforeExtraction' "$APP/Contents/Info.plist")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print SURequireSignedFeed' "$APP/Contents/Info.plist")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print SUSignedFeedFailureExpirationInterval' "$APP/Contents/Info.plist")" = 0
          test -n "$(/usr/libexec/PlistBuddy -c 'Print NSAppleEventsUsageDescription' "$APP/Contents/Info.plist")"
          otool -L "$APP/Contents/MacOS/Impuls" | grep -F '@rpath/Sparkle.framework/'
          otool -l "$APP/Contents/MacOS/Impuls" | grep -A2 LC_RPATH | grep -F '@executable_path/../Frameworks'
          codesign --verify --deep --strict "$APP"
          ENTITLEMENTS="$RUNNER_TEMP/impuls-entitlements.plist"
          codesign -d --entitlements - --xml "$APP" > "$ENTITLEMENTS"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.personal-information.calendars' "$ENTITLEMENTS")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.automation.apple-events' "$ENTITLEMENTS")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.disable-library-validation' "$ENTITLEMENTS")" = true
          if otool -L "$APP/Contents/MacOS/Impuls" | grep -q MediaRemote; then
            echo "Impuls links MediaRemote" >&2
            exit 1
          fi

      - name: Verify localization keys
        run: |
          python3 - <<'PY'
          import io, pathlib, re, sys
          code = set()
          for path in pathlib.Path("Sources").rglob("*.swift"):
              code |= set(re.findall(r'localized\("([^"]+)"', io.open(path, encoding="utf-8").read()))
          bad = False
          for table in pathlib.Path("Resources").glob("*.lproj/Localizable.strings"):
              text = io.open(table, encoding="utf-8").read()
              keys = {k.replace("\\n", "\n") for k in re.findall(r'^"((?:[^"\\]|\\.)*)"\s*=', text, re.M)}
              missing = code - keys
              if missing:
                  bad = True
                  print(f"{table}: missing keys: {sorted(missing)}")
          sys.exit(1 if bad else 0)
          PY

      - name: Smoke-test application without unsolicited networking
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Impuls.app"
          LOG="$RUNNER_TEMP/impuls-smoke.log"
          CI=true "$APP/Contents/MacOS/Impuls" >"$LOG" 2>&1 &
          APP_PID=$!
          cleanup() { kill "$APP_PID" >/dev/null 2>&1 || true; wait "$APP_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for _ in {1..20}; do
            kill -0 "$APP_PID" >/dev/null 2>&1 || { cat "$LOG"; exit 1; }
            sleep 0.5
          done

          CONNECTIONS="$(lsof -nP -a -p "$APP_PID" -i 2>/dev/null || true)"
          test -z "$CONNECTIONS" || { echo "$CONNECTIONS" >&2; exit 1; }
          cleanup
          trap - EXIT

      - name: Build test update artifacts
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          ./Scripts/dmg.sh
          VERSION="$(sed -n 's/^VERSION=//p' Scripts/version)"
          ditto -c -k --keepParent build/Impuls.app "build/Impuls-$VERSION.zip"
          shasum -a 256 "build/Impuls-$VERSION.dmg" > "build/Impuls-$VERSION.dmg.sha256"
          shasum -a 256 "build/Impuls-$VERSION.zip" > "build/Impuls-$VERSION.zip.sha256"
          hdiutil verify "build/Impuls-$VERSION.dmg"
          shasum -a 256 -c "build/Impuls-$VERSION.dmg.sha256"
          shasum -a 256 -c "build/Impuls-$VERSION.zip.sha256"
          EXTRACTED="$RUNNER_TEMP/impuls-update"
          mkdir -p "$EXTRACTED"
          ditto -x -k "build/Impuls-$VERSION.zip" "$EXTRACTED"
          codesign --verify --deep --strict "$EXTRACTED/Impuls.app"

      - name: Store test artifacts
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Impuls-test-${{ github.run_id }}
          path: |
            build/Impuls-*.dmg
            build/Impuls-*.dmg.sha256
            build/Impuls-*.zip
            build/Impuls-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
