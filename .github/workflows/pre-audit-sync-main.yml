name: pre-audit documentation sync main

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pre-audit-sync-main.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Synchronize 1.4.12 audit baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'AGENTS.md',
              'At Documentation v1.3 the baseline in `main` is Impuls 1.4.11. Always verify `Scripts/version` when the exact version matters.',
              'At Documentation v1.3 the baseline in `main` is Impuls 1.4.12. Always verify `Scripts/version` when the exact version matters. For a whole-repository security/performance audit, also read `knowledge-base/00-project/pre-audit-baseline-1.4.12.md` and audit `main` only; historical branches and release handoffs are not current source of truth.'
          )

          replace_once('knowledge-base/10-ai/invariants.md', 'app_version: 1.4.11', 'app_version: 1.4.12')
          replace_once(
              'knowledge-base/10-ai/invariants.md',
              '6. Network access имеет только явно утверждённых владельцев. На baseline 1.4.11 их три: updates, explicit web music, opt-in version statistics.',
              '6. Network access имеет только явно утверждённых владельцев. На baseline 1.4.12 их три: updates, explicit web music, opt-in version statistics.'
          )

          replace_once(
              'PRIVACY.md',
              'The public 1.4.11 build is configured for the first-party endpoint',
              'The public 1.4.12 build is configured for the first-party endpoint'
          )
          replace_once(
              'PRIVACY.md',
              '  "app_version": "1.4.11",\n  "previous_version": "1.4.10"',
              '  "app_version": "1.4.12",\n  "previous_version": "1.4.11"'
          )

          replace_once(
              'SECURITY.md',
              'The latest documented review is\n[`docs/audits/1.4.10-version-statistics.md`](docs/audits/1.4.10-version-statistics.md).',
              'The current whole-repository audit starting point is\n[`knowledge-base/00-project/pre-audit-baseline-1.4.12.md`](knowledge-base/00-project/pre-audit-baseline-1.4.12.md).\nThe 1.4.10 version-statistics audit remains historical evidence for that subsystem; it does not override the current 1.4.12 code, tests, CI, privacy or release contracts.'
          )

          replace_once(
              'knowledge-base/INDEX.md',
              '- [Project Status](00-project/project-status.md)',
              '- [Project Status](00-project/project-status.md)\n- [Pre-Audit Baseline — 1.4.12](00-project/pre-audit-baseline-1.4.12.md)'
          )
          replace_once(
              'knowledge-base/INDEX.md',
              '- [1.4.11 Retrospective Evidence](13-qa/release-evidence/1.4.11.md)',
              '- [1.4.11 Retrospective Evidence](13-qa/release-evidence/1.4.11.md)\n- [1.4.12 Release Evidence](13-qa/release-evidence/1.4.12.md)'
          )

          replace_once(
              'knowledge-base/10-ai/AI-INDEX.md',
              '- [Current Status](../00-project/project-status.md)',
              '- [Current Status](../00-project/project-status.md)\n- [Pre-Audit Baseline — 1.4.12](../00-project/pre-audit-baseline-1.4.12.md)'
          )
          replace_once(
              'knowledge-base/10-ai/AI-INDEX.md',
              '## Trust rule',
              '''### Full-repository security / performance audit
Read [Pre-Audit Baseline — 1.4.12](../00-project/pre-audit-baseline-1.4.12.md) before scanning code. Use `main` as the only current branch, verify `Scripts/version`, and treat `v1.4.12` as the published product tag while later `main` commits may contain documentation-only hardening. Start with inventory and evidence; do not silently rewrite architecture to make a finding disappear. Performance findings must name the owning queue/actor/timer/provider and the measured or testable risk. Security findings must name the trust/data/permission/network boundary and distinguish exploitability from defense-in-depth.\n\n## Trust rule'''
          )

          replace_once(
              'CLAUDE.md',
              'Before planning or editing, inspect `PROJECT-MANIFEST.json` for a fast machine-readable topology, then read `knowledge-base/10-ai/AI-INDEX.md`.',
              'Before planning or editing, inspect `PROJECT-MANIFEST.json` for a fast machine-readable topology, then read `knowledge-base/10-ai/AI-INDEX.md`. For a whole-repository security/performance audit, also read `knowledge-base/00-project/pre-audit-baseline-1.4.12.md` and use `main` as the only current source branch.'
          )

          manifest_path = Path('PROJECT-MANIFEST.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['knowledge_entrypoints']['pre_audit_baseline'] = 'knowledge-base/00-project/pre-audit-baseline-1.4.12.md'
          menu_bar = next(item for item in manifest['presentation_surfaces'] if item['id'] == 'menu_bar')
          status_source = 'Sources/Impuls/App/MenuBarStatusItemPresentation.swift'
          if status_source not in menu_bar['core_sources']:
              menu_bar['core_sources'].append(status_source)
          validation = manifest['validation']
          for path in [
              'Scripts/check-qa-impact.py',
              'Scripts/qa-impact-rules.json',
              'Scripts/check-release-qa-evidence.py',
              'Scripts/release-qa-policy.json',
          ]:
              if path not in validation['repository_paths']:
                  validation['repository_paths'].append(path)
          for command in [
              'python3 Scripts/check-qa-impact.py --base <base-sha>',
              'python3 Scripts/check-release-qa-evidence.py --release-gate',
          ]:
              if command not in validation['commands']:
                  validation['commands'].append(command)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          baseline = '''---
title: Pre-Audit Baseline — Impuls 1.4.12
type: project-baseline
status: active
documentation_version: 1.3
app_version: 1.4.12
last_reviewed: 2026-08-19
tags: [impuls, audit, security, performance, codex, claude, baseline]
---

# Pre-Audit Baseline — Impuls 1.4.12

## Purpose

This is the trusted starting point for the next whole-repository security and performance audit. It exists to prevent Codex, Claude or a human reviewer from reconstructing current state from historical branches, old release handoffs or stale subsystem audits.

## Source-of-truth order

1. `main` — the only current source branch after pre-audit branch cleanup.
2. `Scripts/version` — current product baseline, `1.4.12`.
3. `PROJECT-MANIFEST.json` — routing-only map to canonical owners.
4. `knowledge-base/00-project/project-status.md` — current architecture/documentation status.
5. code + tests + current CI contracts for the subsystem being reviewed.
6. current canonical knowledge-base document linked by the manifest/type map.
7. release-specific QA evidence when a claim depends on real macOS/TCC/hardware behavior.

Historical `docs/` audits, release handoffs and old branch names are evidence only. They do not override current code/tests/CI.

## Release / main relationship

Published product release: **Impuls 1.4.12**.

The tag `v1.4.12` identifies the released product code. `main` may be ahead of that tag because post-release documentation, QA traceability and anti-drift protections were strengthened without changing `Scripts/version` or product Swift behavior. Do not treat those documentation-only commits as a newer product version.

The 1.4.12 Release QA Evidence decision is `ship-with-known-gaps`. `UI-06` has real-Mac visual evidence; unperformed manual/hardware/TCC rows remain explicit `not-run`. Green deterministic CI must never be converted into a manual hardware/TCC pass.

## Current architecture anchors

- one shared `NotchViewModel` / service graph per process;
- per-display presentation surfaces with exactly one active surface;
- nine shipped panel modules; Menu Bar is a presentation workspace, not a tenth provider module;
- exactly three Internet owners: updates, explicit web music, opt-in version statistics;
- sensitive permissions only after explicit user action;
- local-first content, bounded reads and bounded background work;
- raw Apple-device identifiers stay inside the identity/transport boundary;
- blocking disk/process/socket/device I/O stays off the main actor;
- Sparkle update authenticity remains independent from current Apple Developer ID availability;
- persisted-format, network, permission, privacy, actor/ownership and module-topology changes are documentation-review events.

## Security audit starting routes

Read before reporting findings:

- `knowledge-base/06-security/security-model.md`
- `knowledge-base/06-security/threat-model.md`
- `knowledge-base/06-security/data-classification.md`
- `knowledge-base/06-security/privacy-boundaries.md`
- `knowledge-base/06-security/supply-chain.md`
- `knowledge-base/01-architecture/networking.md`
- `knowledge-base/01-architecture/permissions.md`
- `knowledge-base/03-macos/permissions-and-tcc.md`
- `knowledge-base/03-macos/signing-distribution.md`
- `knowledge-base/05-release/update-system.md`
- `knowledge-base/12-reference/schema-migration-registry.md`

Priority review surfaces: update trust/signing, WebKit navigation/message bridge, optional telemetry payload/consent/collector boundary, Keychain use, encrypted clipboard persistence, backup/restore, raw device identity, usbmuxd/lockdown/TLS parsing, subprocess invocation, file transforms, URL opening and permission prompts.

## Performance audit starting routes

Read before changing cadence/ownership/limits:

- `knowledge-base/01-architecture/state-and-ownership.md`
- `knowledge-base/01-architecture/multi-display.md`
- `knowledge-base/12-reference/background-concurrency-registry.md`
- `knowledge-base/12-reference/resource-budget-registry.md`
- `knowledge-base/12-reference/generated-type-test-doc-map.md`
- `knowledge-base/13-qa/change-impact-traceability.md`

Priority review surfaces: MainActor occupancy, timer/poller duplication, display reconciliation, hover/animation invalidation, clipboard polling/persistence, notes/snippets disk I/O, media refresh/artwork, WebKit lifetime, Calendar cadence, translation tasks, external-device discovery, process/socket timeouts, sleep/wake and teardown.

## Deterministic validation before and after optimization

```bash
swift test -c release
./Scripts/bundle.sh release
python3 Scripts/check-project-manifest.py
python3 Scripts/check-dependency-policy.py
python3 Scripts/generate-architecture-ledger.py --check
python3 Scripts/check-knowledge-base.py
python3 Scripts/generate-knowledge-map.py --check
python3 Scripts/check-documentation-freshness.py
python3 Scripts/check-qa-impact.py --base <base-sha>
python3 Scripts/check-release-qa-evidence.py --all
python3 Scripts/check-documentation-guardian.py --base <base-sha>
```

CI additionally verifies the three-owner Internet boundary, forbidden implementation paths, security/performance budgets, feedback privacy, adaptive UI, pointer lifecycle, bundle identity, localization, unsolicited-network smoke behavior and update artifacts.

## Audit reporting contract

For every finding record:

- severity and confidence;
- exact owner/source path;
- trigger/precondition;
- user/security/performance impact;
- whether the issue is demonstrated, strongly inferred or defense-in-depth;
- existing test/CI/documentation coverage;
- smallest safe remediation;
- regression test or measurable acceptance criterion.

Do not mix optimization and feature work. Do not remove limits, consent boundaries, signature verification or safety checks merely to reduce CPU/memory. Preserve animation quality while eliminating unnecessary work ownership, wakeups, allocations and main-thread blocking.

## Private operations boundary

This public repository is the source of truth for software behavior and contracts. Live production host/network/VPN/reverse-proxy/backup/dashboard state belongs to the private `TumanovNV/office-it-docs` operational vault. Do not copy private topology or secrets into this repository during the audit.
'''
          Path('knowledge-base/00-project/pre-audit-baseline-1.4.12.md').write_text(baseline, encoding='utf-8')
          PY

      - name: Commit synchronized documentation and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pre-audit-sync-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: establish 1.4.12 pre-audit baseline'
          git push origin HEAD:main
