name: Problem report / Сообщить о проблеме
description: Tell us what failed and how to reproduce it / Опишите сбой и способ его повторить
title: "[Problem] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Impuls. GitHub issues are public: remove personal data, clipboard contents, file paths, calendar details, and secrets before submitting.

        Спасибо, что помогаете улучшать Impuls. Issues на GitHub публичны: удалите персональные данные, содержимое буфера, пути к файлам, сведения календаря и секреты.
  - type: textarea
    id: problem
    attributes:
      label: What happened? / Что произошло?
      placeholder: Describe the result you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Как повторить?
      placeholder: |
        1. Open…
        2. Choose…
        3. See…
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Related area / Связанный раздел
      options:
        - Whole app / Всё приложение
        - Actions
        - Shelf / Полка
        - Clipboard / Буфер обмена
        - Calendar / Календарь
        - Media / Музыка
        - Translate / Перевод
        - Notes or Snippets / Заметки или заготовки
        - Settings or other / Настройки или другое
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency / Частота
      options:
        - Every time / Каждый раз
        - Often / Часто
        - Sometimes / Иногда
        - Once / Один раз
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Impuls version / Версия Impuls
      placeholder: Shown in Impuls → About Impuls / Указана в Impuls → Об Impuls
    validations:
      required: true
  - type: dropdown
    id: rating
    attributes:
      label: Overall experience / Общая оценка
      options:
        - Not specified / Не указана
        - 5 — Excellent / Отлично
        - 4 — Good / Хорошо
        - 3 — Acceptable / Приемлемо
        - 2 — Difficult / Неудобно
        - 1 — Poor / Плохо
  - type: input
    id: system
    attributes:
      label: macOS and Mac architecture / macOS и архитектура Mac
      placeholder: macOS 15.6, Apple Silicon
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / Проверка приватности
      options:
        - label: I removed personal, confidential, and security-sensitive data / Я удалил персональные, конфиденциальные и чувствительные данные
          required: true
